# The only place to configure models. Experiments select one name with model_profile.
# model is the exact model ID accepted by the endpoint (no LiteLLM provider prefix).
# protocol: openai means OpenAI-compatible chat completions, including gateways.
# temperature: null omits temperature for models which do not support it.
version: 1
profiles:
  deepseek-official:
    protocol: openai
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    temperature: 0
    max_tokens: 8192
    token_limit_parameter: max_tokens
  openai-official:
    protocol: openai
    model: gpt-5.5
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    temperature: null
    max_tokens: 8192
    token_limit_parameter: max_completion_tokens
  openai-gateway:
    protocol: openai
    model: gpt-5.5
    base_url: https://your-gateway.example/v1
    api_key_env: GATEWAY_API_KEY
    temperature: null
    max_tokens: 8192
    token_limit_parameter: max_completion_tokens
  gpt:
    protocol: openai
    model: gpt-6-sol
    base_url: https://api.rootflowai.com/v1
    api_key_env: GPT_API_KEY
    temperature: null
    max_tokens: 8192
    token_limit_parameter: max_completion_tokens
  claude:
    protocol: openai
    model: claude-opus-5-5
    base_url: https://api.rootflowai.com/v1
    api_key_env: CLAUDE_API_KEY
    temperature: null
    max_tokens: 8192
    token_limit_parameter: max_completion_tokens
  gemini:
    protocol: openai
    model: gemini-3.1-pro-preview
    base_url: https://api.rootflowai.com/v1
    api_key_env: GEMINI_API_KEY
    temperature: null
    max_tokens: 8192
    token_limit_parameter: max_completion_tokens
